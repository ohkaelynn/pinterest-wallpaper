name: CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  build-and-test:
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4

      - name: Setup .NET 8
        uses: actions/setup-dotnet@v4
        with:
          dotnet-version: '8.0.x'

      - name: Restore & Test
        run: dotnet test PinterestWallpaper.sln -c Release

      - name: Build Full Solution
        run: dotnet build PinterestWallpaper.sln -c Release --no-restore
